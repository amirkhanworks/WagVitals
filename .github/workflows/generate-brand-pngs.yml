name: Generate WagVitals brand PNG assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/img/brand/*.svg"

permissions:
  contents: write

jobs:
  generate-brand-pngs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pillow cairosvg

      - name: Generate PNG assets
        run: python tools/build-brand-pngs.py

      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/brand/*.png
          git commit -m "Generate WagVitals PNG brand assets"
          git push
