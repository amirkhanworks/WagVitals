name: Website stress QA

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/img/brand/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/website-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wagvitals-website-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the pushed commit to reach GitHub Pages
        env:
          GITHUB_SHA: \${{ github.sha }}
        run: |
          node <<'NODE'
          const url = 'https://amirkhanworks.github.io/WagVitals/contact.html?qa=' + process.env.GITHUB_SHA;
          const expected = 'Your details will not be sent or stored';
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                const html = await response.text();
                if (response.ok && html.includes(expected) && !/<form[^>]*action=/.test(html)) {
                  console.log('The new Contact page is live.');
                  return;
                }
              } catch (error) {
                console.log('Waiting for Pages: ' + error.message);
              }
              await pause(5000);
            }
            throw new Error('GitHub Pages did not publish the pushed Contact page within five minutes.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.54.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser QA
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload Playwright report and traces
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: wagvitals-playwright-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
